name: Tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  process-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: ShellCheck all shell scripts
        run: find . -type f -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -r shellcheck
      - run: bash -n check.sh tests/test_check.sh
      - run: bash tests/test_check.sh
      - run: bash tests/test_scripts.sh
